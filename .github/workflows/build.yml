name: build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  build:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDKs
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: |
            25
            ${{ matrix.java }}
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Build, test with Gradle
        run: ./gradlew -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64 clean check testCodeCoverageReport :restdocs-api-spec-example:openapi3 --no-daemon

      - name: Upload coverage to Codecov
        if: matrix.java == '17'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          files: ./build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml
          flags: tests
          name: main-tests-jdk-17
