name: build

on:
  push:
    branches:
      - v1.x
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - v1.x
    paths-ignore:
      - '**.md'

jobs:
  build:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            17
            ${{ matrix.java }}
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build, test with Gradle
        run: ./gradlew -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64 clean check testCodeCoverageReport :restdocs-api-spec-example:openapi3 --no-daemon

      - name: Upload coverage to Codecov
        if: matrix.java == '17'
        uses: codecov/codecov-action@v5
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          files: ./build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml
          flags: tests
          name: v1.x-tests-jdk-17
