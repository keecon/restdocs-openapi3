name: release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            17
            ${{ matrix.java }}
          cache: gradle

      - name: Verify tag ancestry
        run: |
          test "${GITHUB_REF_NAME%%.*}" = "1"
          git fetch origin v1.x
          git merge-base --is-ancestor "$GITHUB_SHA" origin/v1.x

      - name: Run full build
        run: ./gradlew -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64 clean check testCodeCoverageReport :restdocs-api-spec-example:openapi3 --no-daemon

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
