version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "gradle"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "actions"

  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "v1.x"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "gradle"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Everit 1.14.6 changes generated enum ordering. Keep the v1.x output contract stable.
      - dependency-name: "com.github.erosb:everit-json-schema"
        versions:
          - "1.14.6"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "v1.x"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "actions"
