buildscript {
	repositories {
		maven { url = uri('https://jitpack.io') }
	}
	dependencies {
		classpath 'com.github.keecon.restdocs-openapi3:restdocs-api-spec-gradle-plugin:2.0.0'
	}
}

plugins {
	id 'groovy'
	alias libs.plugins.spring.boot
	alias libs.plugins.spring.dependency.management
}

apply plugin: 'com.keecon.restdocs-openapi3'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

tasks.named('test') {
	outputs.dir file('build/generated-snippets')
}

dependencies {
	implementation libs.spring.boot.starter.webmvc
	implementation libs.spring.boot.starter.validation

	compileOnly libs.lombok
	annotationProcessor libs.lombok

	testImplementation libs.spring.boot.starter.test
	testImplementation libs.spring.boot.starter.webmvc.test
	testImplementation libs.spring.boot.restdocs
	testImplementation libs.spring.restdocs.mockmvc
	testImplementation libs.bundles.spock
	testImplementation libs.bundles.junit
	testImplementation project(':restdocs-api-spec')
	testImplementation project(':restdocs-api-spec-mockmvc')
}

openapi3 {
	server = 'http://localhost:8080'
	title = 'My API'
	description = 'My API description'
	version = project.version
	tagDescriptionsPropertiesFile = 'src/test/resources/openapi-tags.yml'
	format = 'yaml'
}
