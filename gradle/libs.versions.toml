[versions]
kotlin = "2.4.10"
ktlint = "14.2.0"
axion-release = "1.21.2"
jacoco = "0.8.15"
guava = "33.7.1-jre"
spring-boot = "3.5.16"
spring-dependency-management = "1.1.7"
junit-pioneer = "0.3.3"
swagger = "2.2.51"
swagger-parser = "2.1.44"
json-schema-validator = "2.2.14"
everit-json-schema = "1.11.0"
spock = "2.4-groovy-4.0"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
axion-release = { id = "pl.allegro.tech.build.axion-release", version.ref = "axion-release" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-hateoas = { module = "org.springframework.boot:spring-boot-starter-hateoas" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-web = { module = "org.springframework:spring-web" }
spring-restdocs-core = { module = "org.springframework.restdocs:spring-restdocs-core" }
spring-restdocs-mockmvc = { module = "org.springframework.restdocs:spring-restdocs-mockmvc" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
jacoco-agent = { module = "org.jacoco:org.jacoco.agent", version.ref = "jacoco" }
lombok = { module = "org.projectlombok:lombok" }
swagger-core = { module = "io.swagger.core.v3:swagger-core", version.ref = "swagger" }
swagger-parser = { module = "io.swagger.parser.v3:swagger-parser", version.ref = "swagger-parser" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-pioneer = { module = "org.junit-pioneer:junit-pioneer", version.ref = "junit-pioneer" }
assertj-core = { module = "org.assertj:assertj-core" }
jsonpath = { module = "com.jayway.jsonpath:json-path" }
hibernate-validator = { module = "org.hibernate.validator:hibernate-validator" }
json-schema-validator = { module = "com.github.java-json-tools:json-schema-validator", version.ref = "json-schema-validator" }
everit-json-schema = { module = "com.github.erosb:everit-json-schema", version.ref = "everit-json-schema" }
spock-core = { module = "org.spockframework:spock-core", version.ref = "spock" }
spock-spring = { module = "org.spockframework:spock-spring", version.ref = "spock" }

[bundles]
jackson = ["jackson-databind", "jackson-annotations", "jackson-module-kotlin"]
junit = ["junit-jupiter-engine", "junit-pioneer"]
spock = ["spock-core", "spock-spring"]
